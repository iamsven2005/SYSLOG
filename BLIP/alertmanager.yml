global:
  resolve_timeout: 5m
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

route:
  receiver: default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: default
    email_configs:
      - to: your-email@example.com
        from: alertmanager@example.com
        smarthost: smtp.example.com:587
        auth_username: your-smtp-user
        auth_password: your-smtp-pass
        require_tls: true
rule_files:
  - "alert.rules.yml"
